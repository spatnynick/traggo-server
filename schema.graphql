enum Role {
    ADMIN
    USER
}
directive @hasRole(role: Role!) on FIELD_DEFINITION

schema {
    query: RootQuery
    mutation: RootMutation
}

type RootMutation {
    createTag(key: String!, color: String!): TagDefinition @hasRole(role: USER)
    updateTag(key: String!, newKey: String, color: String!): TagDefinition @hasRole(role: USER)
    removeTag(key: String!): TagDefinition @hasRole(role: USER)

    createUser(name: String!, pass: String!, admin: Boolean!): User @hasRole(role: ADMIN)
    removeUser(id: Int!): User @hasRole(role: ADMIN)
    updateUser(id: Int!, name: String!, pass: String, admin: Boolean!): User @hasRole(role: ADMIN)

    login(username: String!, pass: String!, deviceName: String!, type: DeviceType!, cookie: Boolean!): Login

    createDevice(name: String!, type: DeviceType!): Login @hasRole(role: USER)
    updateDevice(id: Int!, name: String!, type: DeviceType!): Device @hasRole(role: USER)
    removeDevice(id: Int!): Device @hasRole(role: USER)
    removeCurrentDevice: Device! @hasRole(role: USER)

    createTimeSpan(start: Time!, end: Time, tags: [InputTimeSpanTag!], note: String!): TimeSpan @hasRole(role: USER)
    updateTimeSpan(id: Int!, start: Time!, end: Time, tags: [InputTimeSpanTag!], oldStart: Time, note: String!): TimeSpan @hasRole(role: USER)
    removeTimeSpan(id: Int!): TimeSpan @hasRole(role: USER)
    replaceTimeSpanTags(from: InputTimeSpanTag!, to: InputTimeSpanTag!, opt: InputReplaceOptions!): Boolean @hasRole(role: USER)
    copyTimeSpan(id: Int!, start: Time!, end: Time): TimeSpan @hasRole(role: USER)
    stopTimeSpan(id: Int!, end: Time!): TimeSpan @hasRole(role: USER)

    createDashboard(name: String!): Dashboard! @hasRole(role: USER)
    updateDashboard(id: Int!, name: String!): Dashboard! @hasRole(role: USER)
    removeDashboard(id: Int!): Dashboard! @hasRole(role: USER)

    addDashboardRange(dashboardId: Int!, range: InputNamedDateRange!): NamedDateRange @hasRole(role: USER)
    updateDashboardRange(rangeId: Int!, range: InputNamedDateRange!): NamedDateRange @hasRole(role: USER)
    removeDashboardRange(rangeId: Int!): NamedDateRange @hasRole(role: USER)

    addDashboardEntry(dashboardId: Int!, entryType: EntryType!, title: String!, total: Boolean!, stats: InputStatsSelection!, pos: InputResponsiveDashboardEntryPos): DashboardEntry @hasRole(role: USER)
    updateDashboardEntry(entryId: Int!, entryType: EntryType, title: String, total: Boolean, stats: InputStatsSelection, pos: InputResponsiveDashboardEntryPos): DashboardEntry @hasRole(role: USER)
    removeDashboardEntry(id: Int!): DashboardEntry! @hasRole(role: USER)

    setUserSettings(settings: InputUserSettings!): UserSettings! @hasRole(role: USER)

    createExportMapping(mapping: InputExportMapping!): ExportMapping @hasRole(role: USER)
    updateExportMapping(id: Int!, mapping: InputExportMapping!): ExportMapping @hasRole(role: USER)
    removeExportMapping(id: Int!): ExportMapping @hasRole(role: USER)
    runExport(run: InputExportRun!): ExportRunResult! @hasRole(role: USER)
    # deletes the output folder of an export run (the folder of the files it reported)
    deleteExportRunFolder(runId: Int!): ExportRun @hasRole(role: USER)
}

type RootQuery {
    suggestTag(query: String!): [TagDefinition!] @hasRole(role: USER)
    suggestTagValue(key: String!, query: String!): [String!] @hasRole(role: USER)
    tags: [TagDefinition!] @hasRole(role: USER)
    users: [User!] @hasRole(role: ADMIN)
    currentUser: User
    currentDevice: Device
    devices: [Device!] @hasRole(role: USER)
    timeSpans(fromInclusive: Time, toInclusive: Time, cursor: InputCursor, filter: String): PagedTimeSpans! @hasRole(role: USER)
    filteredDuration(filter: String): Float! @hasRole(role: USER)
    timers: [TimeSpan!] @hasRole(role: USER)
    stats(ranges: [Range!], tags: [String!], excludeTags: [InputTimeSpanTag!], requireTags: [InputTimeSpanTag!]): [RangedStatisticsEntries!] @hasRole(role: USER)
    stats2(now: Time!, stats: InputStatsSelection!): [RangedStatisticsEntries!] @hasRole(role: USER)
    version: Version!
    dashboards: [Dashboard!] @hasRole(role: USER)
    userSettings: UserSettings!
    status: Status! @hasRole(role: USER)
    exportMappings: [ExportMapping!] @hasRole(role: USER)
    exportRunAvailable: Boolean! @hasRole(role: USER)
    exportRuns: [ExportRun!] @hasRole(role: USER)
    # base64 content of a file reported by an export run
    exportRunFile(runId: Int!, path: String!): String! @hasRole(role: USER)
}

type Status {
    serverTime: Time!
    version: Version!
    runningTimers: [RunningTimer!]!
}

type RunningTimer {
    id: Int!
    start: Time!
}

input InputUserSettings {
    theme: Theme!
    dateLocale: DateLocale!
    firstDayOfTheWeek: WeekDay!
    dateTimeInputStyle: DateTimeInputStyle!
    durationFormat: DurationFormat!
    durationCustomFormat: String!
}

type UserSettings {
    theme: Theme!
    dateLocale: DateLocale!
    firstDayOfTheWeek: WeekDay!
    dateTimeInputStyle: DateTimeInputStyle!
    durationFormat: DurationFormat!
    durationCustomFormat: String!
}

enum WeekDay {
    Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
}

enum Theme {
    GruvboxDark, GruvboxLight, MaterialDark, MaterialLight
}

enum DateLocale {
    American, American24h, German, Australian, British
}

enum DateTimeInputStyle {
    Fancy, Native
}

enum DurationFormat {
    DaysHours, HHMM, DecimalHours, GoStyle, CustomStrftime, CustomGo
}

input InputReplaceOptions {
    override: OverrideMode!
}

enum OverrideMode {
    Override, Discard
}

input InputCursor {
    offset: Int
    startId: Int
    pageSize: Int
}

type Cursor {
    hasMore: Boolean!
    offset: Int!
    startId: Int!
    pageSize: Int!
}

type Version {
    name: String!
    commit: String!
    buildDate: String!
}

type Login {
    token: String!
    user: User!
    device: Device!
}

type Device {
    id: Int!
    name: String!
    type: DeviceType!
    createdAt: Time!
    activeAt: Time!
}

enum DeviceType {
    LongExpiry, ShortExpiry, NoExpiry
}

scalar Time

type TagDefinition {
    color: String!
    key: String!
    user: User!
    usages: Int!
}

type User {
    admin: Boolean!
    id: Int!
    name: String!
}

type TimeSpan {
    id: Int!
    start: Time!
    end: Time
    oldStart: Time
    tags: [TimeSpanTag!]
    # TODO not nullable ^
    note: String!
}

type PagedTimeSpans {
    timeSpans: [TimeSpan!]!
    cursor: Cursor!
}

type TimeSpanTag {
    key: String!
    value: String!
}

input InputTimeSpanTag {
    key: String!
    value: String!
}

input StatInput {
    key: String!
    mustHave: [InputTimeSpanTag!]
    mustNotHave: [InputTimeSpanTag!]
}

input Range {
    start: Time!
    end: Time!
}

type StatisticsEntry {
    key: String!
    value: String!
    timeSpendInSeconds: Float!
}

type RangedStatisticsEntries {
    start: Time!
    end: Time!
    entries: [StatisticsEntry!]
}

type Dashboard {
    id: Int!
    name: String!,
    items: [DashboardEntry!]!
    ranges: [NamedDateRange!]!
}

type NamedDateRange {
    id: Int!
    name: String!
    editable: Boolean!
    range: RelativeOrStaticRange!
}

input InputNamedDateRange {
    name: String!
    editable: Boolean!
    range: InputRelativeOrStaticRange!
}

type StatsSelection {
    interval: StatsInterval!
    tags: [String!]
    excludeTags: [TimeSpanTag!]
    includeTags: [TimeSpanTag!]
    rangeId: Int
    range: RelativeOrStaticRange
}

input InputStatsSelection {
    interval: StatsInterval!
    tags: [String!]
    excludeTags: [InputTimeSpanTag!]
    includeTags: [InputTimeSpanTag!]
    rangeId: Int
    range: InputRelativeOrStaticRange
}

enum StatsInterval {
    Hourly, Daily, Weekly, Monthly, Yearly, Single
}

type RelativeOrStaticRange {
    from: String!
    to: String!
}

input InputRelativeOrStaticRange {
    from: String!
    to: String!
}

type DashboardEntry {
    id: Int!
    title: String!
    total: Boolean!
    statsSelection: StatsSelection!
    pos: ResponsiveDashboardEntryPos!
    entryType: EntryType!
}

type ResponsiveDashboardEntryPos {
    desktop: DashboardEntryPos!
    mobile: DashboardEntryPos!
}
input InputResponsiveDashboardEntryPos {
    desktop: InputDashboardEntryPos
    mobile: InputDashboardEntryPos
}

input InputDashboardEntryPos {
    w: Int!
    h: Int!
    x: Int!
    y: Int!
}

type DashboardEntryPos {
    w: Int!
    h: Int!
    x: Int!
    y: Int!
    minW: Int!
    minH: Int!
}

enum DashboardSize {
    Large,
    Medium,
    Small
}

enum EntryType {
    PieChart, BarChart, StackedBarChart, LineChart, VerticalTable, HorizontalTable
}

# Maps a tag combination to the values an external export script writes.
type ExportMapping {
    id: Int!
    tags: [TimeSpanTag!]!
    client: String!
    project: String!
    # booked automatically by the export script (otherwise: by hand)
    autoBooking: Boolean!
    # the note starts with a reference: "<reference>: <description>"
    noteReference: Boolean!
    # merge all entries of a day into one, keeping the note of the latest entry
    mergeDaily: Boolean!
    subtotalGroup: String!
}

input InputExportMapping {
    tags: [InputTimeSpanTag!]!
    client: String!
    project: String!
    autoBooking: Boolean!
    noteReference: Boolean!
    mergeDaily: Boolean!
    subtotalGroup: String!
}

enum ExportMode {
    OVERVIEW
    FULL
}

# Runs the server's configured export command (TRAGGO_EXPORT_COMMAND).
# Range: month (YYYYMM), or from + to (YYYY-MM-DD), or none = current month.
input InputExportRun {
    month: String
    from: String
    to: String
    mode: ExportMode!
    dryRun: Boolean!
    # what the command should do when its output folder already exists
    ifExists: ExportIfExists!
}

enum ExportIfExists {
    # stop without writing; the result names the existing folder
    FAIL
    # write to a new folder with a counter suffix (-2, -3, ...)
    COUNTER
}

type ExportRunResult {
    # null when the run was not done because its output folder exists
    run: ExportRun
    existingFolder: String
}

type ExportRun {
    id: Int!
    startedAt: Time!
    durationMs: Int!
    month: String!
    from: String!
    to: String!
    mode: ExportMode!
    dryRun: Boolean!
    exitCode: Int!
    log: String!
    files: [ExportFile!]!
    # output folder (folder of the reported files), empty if nothing was written
    folder: String!
    folderExists: Boolean!
}

# A file the export command reported with a "TRAGGO-EXPORT-FILE: <path>" output line.
type ExportFile {
    name: String!
    path: String!
}
